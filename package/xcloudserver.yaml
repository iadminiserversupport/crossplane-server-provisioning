},
"instanceType": {
"type": "string",
"description": "AWS EC2 instance type.",
"default": "t3.micro"
},
"ami": {
"type": "string",
"description": "AWS AMI ID to use for the server."
},
"providerConfigRef": {
"type": "string",
"description": "AWS ProviderConfig name.",
"default": "default"
}
},
"required": [
